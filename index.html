<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Section</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        /* About 卡片的样式写在 sections/about.html 里 */

        /* Additional CSS for Projects Section */
        .projects-section {
            position: relative;
            z-index: 1;
            padding-top: 0px;
        }

        .projects-section h2 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 2.5rem;
        }

        .card {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            /* Adds a subtle shadow around the card */
        }

        .card-img-top {
            max-height: 180px;
            /* Adjust this value to fit the image properly in the card */
            object-fit: cover;
            /* This makes sure the image covers the area properly */
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 1.25rem;
        }

        .card-text {
            margin-bottom: 15px;
        }

        /* Skills 卡片的样式写在 sections/skills.html 里 */

        /* Contact 的样式写在 sections/contact.html 里 */

        /* CSS for Sticky Navbar */
        .navbar {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            /* Adds a shadow for depth */
        }

        /* Ensure padding is added to body to avoid content being hidden behind the navbar */
        body {
            padding-top: 56px;
            /* Adjust this value based on the height of your navbar */
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Style for navigation bar links */
        .navbar-nav .nav-link {
            color: white;
        }

        .navbar-nav .nav-link:hover {
            color: #f8f9fa;
            /* Slightly lighter white when hovering over links */
        }

        /* Media query for responsive navbar collapsing */
        @media (max-width: 992px) {
            .navbar-collapse {
                background-color: #343a40;
                /* Same as navbar color for seamless look */
            }
        }

        section[id] {
            scroll-margin-top: 56px;
        }

        /* Projects category nav - sticky centered pill bar */
        .projects-nav-wrapper {
            position: sticky;
            top: 56px;
            z-index: 1020;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            margin-bottom: 8px;
        }

        .projects-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            width: fit-content;
            margin: 0 auto;
        }

        .projects-nav-filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .projects-nav .category-link {
            padding: 6px 16px;
            color: #495057;
            text-decoration: none;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-align: center;
        }

        .projects-nav .category-link:hover {
            background-color: #e9ecef;
            color: #007bff;
            border-color: #007bff;
        }

        .projects-nav .category-link.active {
            background-color: #007bff;
            color: #fff;
            border-color: #0056b3;
        }

        /* ===== 分页显示：一次只显示一个 section，切换为瞬间跳转 ===== */
        #page-viewport {
            position: relative;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 左右翻页按钮 */
        .page-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1030;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background-color: rgba(52, 58, 64, 0.55);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .page-arrow:hover {
            opacity: 1;
            background-color: rgba(52, 58, 64, 0.85);
        }

        .page-arrow:disabled {
            opacity: 0;
            pointer-events: none;
        }

        .page-arrow.prev {
            left: 12px;
        }

        .page-arrow.next {
            right: 12px;
        }

        @media (max-width: 576px) {
            .page-arrow {
                display: none;
            }
        }

    </style>

</head>

<body>
    <!-- Sections -->
    <!--<div class="container-fluid">-->
    <div id="page-viewport">
        <div id="home-placeholder" class="page"></div>
        <div id="about-placeholder" class="page"></div>
        <div id="projects-placeholder" class="page"></div>
        <div id="skills-placeholder" class="page"></div>
        <!-- <div id="resources-placeholder" class="page"></div>-->
        <div id="contact-placeholder" class="page"></div>
    </div>

    <button class="page-arrow prev" type="button" aria-label="Previous page">
        <i class="fas fa-chevron-left"></i>
    </button>
    <button class="page-arrow next" type="button" aria-label="Next page">
        <i class="fas fa-chevron-right"></i>
    </button>
    <!--</div>-->

    <!-- Bootstrap JS and dependencies (jQuery and Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.9.5/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(function () {
            // ---- 页面顺序与容器 ----
            var order = ['home', 'about', 'projects', 'skills', 'contact'];
            var placeholders = {
                home: '#home-placeholder',
                about: '#about-placeholder',
                projects: '#projects-placeholder',
                skills: '#skills-placeholder',
                contact: '#contact-placeholder'
            };
            var current = null;

            function pageFromHash() {
                var name = (window.location.hash || '').replace('#', '');
                return placeholders[name] ? name : 'home';
            }

            function syncUI(name) {
                $('.navbar-nav .nav-link').removeClass('active');
                $('.navbar-nav a[href="#' + name + '"]').addClass('active');
                var i = order.indexOf(name);
                $('.page-arrow.prev').prop('disabled', i <= 0);
                $('.page-arrow.next').prop('disabled', i >= order.length - 1);
            }

            // ---- 翻页：瞬间跳转，无动画 ----
            function goTo(name, push) {
                if (!placeholders[name] || name === current) return;

                $(placeholders[current]).removeClass('active');
                $(placeholders[name]).addClass('active');
                current = name;

                // 直接置顶，不做平滑滚动
                var behavior = document.documentElement.style.scrollBehavior;
                document.documentElement.style.scrollBehavior = 'auto';
                window.scrollTo(0, 0);
                document.documentElement.style.scrollBehavior = behavior;

                syncUI(name);
                if (push !== false && '#' + name !== window.location.hash) {
                    history.pushState({ page: name }, document.title, '#' + name);
                }
            }

            // ---- 初始页面 ----
            current = pageFromHash();
            $(placeholders[current]).addClass('active');
            syncUI(current);

            // ---- 载入各 section ----
            $("#home-placeholder").load("sections/home.html");
            $("#about-placeholder").load("sections/about.html");
            $("#projects-placeholder").load("sections/projects.html");
            $("#skills-placeholder").load("sections/skills.html");
            $("#contact-placeholder").load("sections/contact.html");

            // ---- 导航拦截：只接管指向这几页的链接，页内锚点不受影响 ----
            $(document).on('click', 'a[href^="#"]', function (e) {
                var name = ($(this).attr('href') || '').slice(1);
                if (!placeholders[name]) return;
                e.preventDefault();
                $('.navbar-collapse').collapse('hide');
                goTo(name);
            });

            // ---- 左右箭头按钮 ----
            $('.page-arrow').on('click', function () {
                var step = $(this).hasClass('next') ? 1 : -1;
                var target = order[order.indexOf(current) + step];
                if (target) goTo(target);
            });

            // ---- 键盘 ← → 翻页 ----
            $(document).on('keydown', function (e) {
                if ($(e.target).is('input, textarea, select')) return;
                if (e.key === 'ArrowRight') {
                    var next = order[order.indexOf(current) + 1];
                    if (next) goTo(next);
                } else if (e.key === 'ArrowLeft') {
                    var prev = order[order.indexOf(current) - 1];
                    if (prev) goTo(prev);
                }
            });

            // ---- 触屏左右滑动 ----
            var touchX = null, touchY = null;
            $(document).on('touchstart', function (e) {
                var t = e.originalEvent.touches[0];
                touchX = t.clientX;
                touchY = t.clientY;
            });
            $(document).on('touchend', function (e) {
                if (touchX === null) return;
                var t = e.originalEvent.changedTouches[0];
                var dx = t.clientX - touchX;
                var dy = t.clientY - touchY;
                touchX = touchY = null;
                if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                var target = order[order.indexOf(current) + (dx < 0 ? 1 : -1)];
                if (target) goTo(target);
            });

            // ---- 浏览器前进/后退 ----
            $(window).on('popstate', function () {
                goTo(pageFromHash(), false);
            });
        });
    </script>

    <!-- Sticky Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#home">Portfolio</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#skills">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</body>

</html>
