<style>
    .home-hero {
        position: relative;
        color: white;
        height: 92vh;
        line-height: normal;
        font-size: 1rem;
        overflow: hidden;
    }

    .home-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('images/about/about_use.jpg');
        background-size: cover;
        background-position: center;
        filter: brightness(1.5);
        z-index: 0;
    }

    .home-hero .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* 顶部压深一点，保证任何裁切位置白字都读得清 */
        background: linear-gradient(to bottom,
                rgba(0, 0, 0, 0.45) 0%,
                rgba(0, 0, 0, 0.25) 45%,
                rgba(0, 0, 0, 0) 75%);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        text-align: center;
        padding: 12vh 20px 20px;
    }

    /* 文字压在最上方的深蓝夜空上，露出下面的极光、人物和雪景 */
    .home-hero .content {
        max-width: 800px;
    }

    .home-hero .content h1,
    .home-hero .content h2 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin-bottom: 18px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    .home-hero .content p {
        font-size: clamp(1.05rem, 2.2vw, 1.35rem);
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.02em;
        margin-bottom: 0;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    /* 底部向下箭头 */
    .home-hero .scroll-arrow {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        border: 2px solid white;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        transition: background-color 0.3s;
        animation: bounce 2s infinite;
    }

    .home-hero .scroll-arrow:hover {
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
    }

    /* 向下轻轻弹跳动画 */
    @keyframes bounce {

        0%,
        20%,
        50%,
        80%,
        100% {
            transform: translate(-50%, 0);
        }

        40% {
            transform: translate(-50%, 8px);
        }

        60% {
            transform: translate(-50%, 4px);
        }
    }
</style>

<section id="home" class="home-hero">
    <div class="overlay">
        <div class="content">
            <h2>Hi, I am Xiaoxiang Cheng.</h2>
            <p>Welcome to my portfolio!</p>
        </div>
        <!-- 向下箭头：跳到 About 页（暂时隐藏）
        <a href="#about" class="scroll-arrow">
            <i class="fas fa-arrow-down"></i>
        </a>
        -->
    </div>
</section>
